<!DOCTYPE html>
<html>
<head>
    <title>Attendance Records</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>Attendance Records</h1>

<table>
    <tr>
        <th>Student Name</th>
        <th>Date</th>
        <th>Status</th>
    </tr>

    {% for record in records %}
    <tr>
        <td>{{ record[0] }}</td>
        <td>{{ record[1] }}</td>
        <td>{{ record[2] }}</td>
    </tr>
    {% else %}
    <tr>
        <td colspan="3">No attendance records found.</td>
    </tr>
    {% endfor %}
</table>

<br>

<a href="/">Back to Home</a>

</body>
</html>
